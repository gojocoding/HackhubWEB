
<div class="register-page">
  <div class="register-card">

    <a routerLink="/" class="logo">Hack<span>hub</span></a>

    <h1>Crea il tuo account</h1>
    <p class="subtitle">Entra nella community di Hackhub</p>

    <form (ngSubmit)="onRegister()">

      <div class="form-group">
        <label for="name">Nome</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="name"
          placeholder="Inserisci il tuo nome"
          required>
      </div>

      <div class="form-group">
        <label for="surname">Cognome</label>
        <input
          type="text"
          id="surname"
          name="surname"
          [(ngModel)]="surname"
          placeholder="Inserisci il tuo cognome"
          required>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="Scegli uno username"
          required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Inserisci la tua email"
          required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Scegli una password"
          required>
      </div>

      <div class="form-group">
        <label for="paymentInfo">Informazioni di pagamento</label>
        <input
          type="text"
          id="paymentInfo"
          name="paymentInfo"
          [(ngModel)]="paymentInfo"
          placeholder="Facoltativo">
      </div>

      <button type="submit" class="register-button">
        Registrati
      </button>

    </form>

    <p class="login-link">
      Hai già un account?
      <a routerLink="/login">Accedi</a>
    </p>

  </div>
</div>
